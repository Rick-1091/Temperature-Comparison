<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weatherbridge</title><link rel="stylesheet" href="../../site.css"><style>.price-example{padding:24px 0}.price-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:30px 0}.price-grid>div{padding:20px 8px;border-bottom:2px solid var(--wb-line);text-align:center;font-size:15px}.price-grid strong{display:block;font-size:34px;margin-top:14px}.price-top{color:var(--wb-accent);border-color:var(--wb-accent)!important}@media(max-width:600px){.price-grid{gap:5px}.price-grid strong{font-size:26px}.price-grid>div{font-size:12px;padding:12px 0}}</style></head><body><wb-header></wb-header><main id="main" class="wb-page"><div class="wb-breadcrumb"><a href="../../cases/mexico-city/" data-preserve-language data-zh="← 返回墨西哥城故事" data-en="← Back to the Mexico City story">← 返回墨西哥城故事</a></div><h1 class="" data-zh="Polymarket 是什么？" data-en="What is Polymarket?">Polymarket 是什么？</h1><p class="wb-lead" data-zh="人们在这里买卖与未来结果有关的合约。想读懂价格，先看看合约怎样结算。" data-en="People trade contracts tied to future outcomes. To understand a price, start with how the contract settles.">人们在这里买卖与未来结果有关的合约。想读懂价格，先看看合约怎样结算。</p><section class="price-example" aria-label="Illustrative temperature market"><h2 class="" data-zh="示意：明天最高温会是多少？" data-en="Illustrative: tomorrow’s highest temperature?">示意：明天最高温会是多少？</h2><div class="price-grid"><div>≤23°C<strong>8¢</strong></div><div>24°C<strong>18¢</strong></div><div class="price-top">25°C<strong>42¢</strong></div><div>26°C<strong>22¢</strong></div><div>≥27°C<strong>10¢</strong></div></div><p class="" data-zh="25°C 的报价最高。42¢ 不代表 42% 的人投票。" data-en="25°C has the highest quote. 42¢ does not mean 42% of people voted for it.">25°C 的报价最高。42¢ 不代表 42% 的人投票。</p><p class="wb-caption" data-zh="这是价格示意，不是实时市场或明日预报。" data-en="These are illustrative prices, not a live market or tomorrow’s forecast.">这是价格示意，不是实时市场或明日预报。</p></section><details class="wb-disclosure"><summary data-zh="价格为什么可能包含信息？ +" data-en="Why might prices contain information? +"></summary><p class="" data-zh="不同结果对应可交易合约。以 Yes 合约为例，如果规则规定结果发生时按 $1 结算，未发生时按 $0 结算，参与者愿意以多高的价格买入或卖出，就会反映他们对结果的判断。随着新信息进入市场，买卖价格也会变化。" data-en="Different outcomes have tradable contracts. For a Yes contract whose rules specify a $1 payout if the outcome occurs and $0 otherwise, the prices people will buy or sell at can reflect their judgment about that outcome. Prices can change as new information enters the market.">不同结果对应可交易合约。以 Yes 合约为例，如果规则规定结果发生时按 $1 结算，未发生时按 $0 结算，参与者愿意以多高的价格买入或卖出，就会反映他们对结果的判断。随着新信息进入市场，买卖价格也会变化。</p><p data-zh="这个价格可以作为市场信号，但不是经过校准的天气概率。" data-en="The price can be read as a market signal, but it is not a calibrated weather probability."></p><p data-zh="市场也会判断错。交易很少、参与者有限或合约规则特殊时，价格尤其需要谨慎解释。" data-en="Markets can be wrong. Read prices with extra caution when trading is thin, participation is limited or contract rules are unusual."></p></details><p><a href="../methods/" data-preserve-language data-zh="了解报价时点、观测与结算规则 →" data-en="Check quote timing, observations and settlement rules →"></a></p><a class="wb-primary" href="../guide/" data-preserve-language data-preserve-selection data-zh="看看真实历史报价与观测怎样对应 →" data-en="Compare real historical quotes and observations →"></a></main><script src="../../site-header.js"></script><script type="module" src="../../reading.js"></script></body></html>
