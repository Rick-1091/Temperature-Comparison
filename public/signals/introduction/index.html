<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weatherbridge</title><link rel="stylesheet" href="../../site.css"><style>.price-example{padding:24px 0}.price-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:30px 0}.price-grid>div{padding:20px 8px;border-bottom:2px solid var(--wb-line);text-align:center;font-size:15px}.price-grid strong{display:block;font-size:34px;margin-top:14px}.price-top{color:var(--wb-accent);border-color:var(--wb-accent)!important}@media(max-width:600px){.price-grid{gap:5px}.price-grid strong{font-size:26px}.price-grid>div{font-size:12px;padding:12px 0}}</style></head><body><wb-header></wb-header><main id="main" class="wb-page"><div class="wb-breadcrumb"><a href="../../cases/mexico-city/" data-preserve-language>← USE / Mexico City</a></div><h1 class="" data-zh="Polymarket 是什么？" data-en="What is Polymarket?">Polymarket 是什么？</h1><p class="wb-lead" data-zh="一个预测市场：人们买卖不同结果的合约，价格随判断和交易变化。" data-en="A prediction market: people trade contracts on different outcomes, and prices change with judgments and trading.">一个预测市场：人们买卖不同结果的合约，价格随判断和交易变化。</p><section class="price-example" aria-label="Illustrative temperature market"><h2 class="" data-zh="示意：明天最高温会是多少？" data-en="Illustrative: tomorrow’s highest temperature?">示意：明天最高温会是多少？</h2><div class="price-grid"><div>≤23°C<strong>8¢</strong></div><div>24°C<strong>18¢</strong></div><div class="price-top">25°C<strong>42¢</strong></div><div>26°C<strong>22¢</strong></div><div>≥27°C<strong>10¢</strong></div></div><p class="" data-zh="25°C 的报价最高。42¢ 不代表 42% 的人投票。" data-en="25°C has the highest quote. 42¢ does not mean 42% of people voted for it.">25°C 的报价最高。42¢ 不代表 42% 的人投票。</p><p class="wb-caption" data-zh="这是价格示意，不是实时市场或明日预报。" data-en="These are illustrative prices, not a live market or tomorrow’s forecast.">这是价格示意，不是实时市场或明日预报。</p></section><details class="wb-disclosure"><summary data-zh="价格为什么可能包含信息？ +" data-en="Why might prices contain information? +"></summary><p class="" data-zh="参与者把信息与判断带入交易，价格随供需变化。信息质量、参与者、流动性与规则都会影响价格，集中不等于正确。" data-en="Participants bring information and judgments into trades, and prices change with supply and demand. Information quality, participants, liquidity and rules matter; concentrated prices need not be correct.">参与者把信息与判断带入交易，价格随供需变化。信息质量、参与者、流动性与规则都会影响价格，集中不等于正确。</p></details><p class="wb-caption" data-zh="市场信号作补充，正式天气预报与预警优先。" data-en="Market signals are supplementary. Official forecasts and warnings take priority.">市场信号作补充，正式天气预报与预警优先。</p><a class="wb-primary" href="../guide/" data-preserve-language data-preserve-selection data-zh="看一次真实历史判断，后来怎样 →" data-en="See what actually happened →"></a></main><script src="../../site-header.js"></script><script type="module" src="../../reading.js"></script></body></html>
