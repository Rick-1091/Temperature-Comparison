<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weatherbridge · 3D drying experience</title><link rel="stylesheet" href="../../site.css"></head><body><wb-header></wb-header><main class="wb-page game-page" id="main"><div class="wb-breadcrumb"><a href="../../signals/guide/" data-preserve-language data-zh="← 回看历史温度证据" data-en="← Review historical temperature evidence"></a> / ACTION</div><h1 data-zh="玉米还在外面。你会怎样准备？" data-en="The maize is outside. How will you prepare?"></h1><p class="wb-lead" data-zh="一个 60–90 秒的 3D 庭院体验。镜头固定，用按钮决定下一步。" data-en="A 60–90 second 3D courtyard experience. Fixed camera; choose your next step with buttons."></p><p class="wb-caption" data-zh="模拟降雨练习：信息与结果均为教学示意，不是马拉维预报或真实 Polymarket 市场。" data-en="Synthetic rainfall exercise: information and outcomes are teaching examples, not a Malawi forecast or a real Polymarket market."></p><div class="diorama"><div id="scene" role="img" aria-label="Interactive 3D courtyard with house, maize rack, cover, storage and character"><img class="game-poster" src="../../thoko-family.png" alt="Illustrated fictional household"></div><div class="game-overlay"><p id="game-status" role="status" aria-live="polite"></p><button id="start-game" class="wb-primary" data-zh="进入庭院 →" data-en="Enter the courtyard →"></button><div id="first-choice" hidden><p data-zh="现在先做什么？" data-en="What will you do first?"></p><div class="game-buttons"><button data-first="all" data-zh="继续晾晒" data-en="Keep drying"></button><button data-first="store" data-zh="收起来" data-en="Bring it in"></button><button data-first="information" data-zh="查看天气信息" data-en="Check weather information"></button></div></div><section id="weather-panel" hidden aria-label="Weatherbridge teaching information"><h2>Weatherbridge</h2><dl><dt data-zh="最可能出现什么？" data-en="What is most likely?"></dt><dd data-zh="教学场景：下午可能有阵雨。" data-en="Teaching scenario: afternoon showers may arrive."></dd><dt data-zh="判断有多确定？" data-en="How uncertain?"></dt><dd data-zh="模拟市场报价：雨 60¢，无雨 40¢；两种结果都有支持。" data-en="Synthetic market quotes: rain 60¢, no rain 40¢. Both outcomes have support."></dd><dt data-zh="过去发生过什么？" data-en="What happened before?"></dt><dd data-zh="10 次示意记录：6 次雨、4 次无雨。不是可靠性证据。" data-en="10 illustrative records: 6 rain, 4 dry. Not evidence of reliability."></dd></dl><p class="wb-caption" data-zh="价格不是投票人数或经校准的降雨概率。" data-en="Price is not a voter share or calibrated rainfall probability."></p></section><div id="second-choice" hidden><p data-zh="看过信息后，你会怎样安排？" data-en="With that information, how will you arrange it?"></p><div class="game-buttons"><button data-choice="all" data-zh="全部晾晒" data-en="Dry all"></button><button data-choice="batch" data-zh="分批晾晒" data-en="Split the batch"></button><button data-choice="cover" data-zh="准备遮盖" data-en="Prepare a cover"></button><button data-choice="store" data-zh="提前收储" data-en="Store early"></button></div></div><div id="weather-choice" hidden><button id="reveal-weather" class="wb-primary" data-zh="准备好了，看看天气 →" data-en="Ready. See the weather →"></button></div><div id="result-choice" hidden><a id="debrief-link" class="wb-primary" data-preserve-language data-zh="这次信息改变了什么？ →" data-en="What did information change? →"></a></div></div></div><div class="game-settings"><button id="pause-motion" data-zh="暂停动画" data-en="Pause animation"></button><button id="restart-game" data-zh="重新体验" data-en="Restart"></button><button id="text-mode" data-zh="低性能 / 文字模式" data-en="Low-performance / text mode"></button></div><p id="fallback-note" class="wb-caption" hidden data-zh="当前使用文字替代模式；选择和复盘仍可完成。支持 WebGL 的设备可重新尝试 3D。" data-en="Text alternative is active. Choices and debrief still work. Retry 3D on a WebGL-capable device."></p><details class="wb-disclosure"><summary data-zh="规则、信息来源与限制 +" data-en="Rules, information sources & limits +"></summary><p data-zh="游戏在开始时抽取一个固定天气结果，选择不改变天气。雨 / 无雨按教学模型抽样；展示价格与历史记录均为人工示意，未调用两地温度数据。模型只比较干燥机会与暴露，不模拟真实食品安全、收成或经济损失。正式天气预警优先。" data-en="A weather outcome is drawn at the start and does not depend on your choice. Rain/no rain follows a teaching model; quotes and historical records are authored examples, not the two cities’ temperature data. The model compares drying opportunity and exposure, not real food safety, yield or financial loss. Official warnings take priority."></p></details></main><script src="../../site-header.js"></script><script type="module" src="../../src/game.js"></script></body></html>
