<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weatherbridge · 3D drying experience</title><link rel="stylesheet" href="../../site.css"></head><body><wb-header></wb-header><main class="wb-page game-page" id="main"><div class="wb-breadcrumb"><a href="../../signals/guide/" data-preserve-language data-zh="← 回看历史温度证据" data-en="← Review historical temperature evidence"></a><span data-zh=" · 晾晒练习" data-en=" · Drying exercise"></span></div><h1 data-zh="玉米还在外面。你会怎样准备？" data-en="The maize is outside. How will you prepare?"></h1><p class="wb-lead" data-zh="玉米正在晾晒。如果下午可能下雨，你会继续晒、分批处理，还是先准备遮盖？" data-en="The maize is drying. If it might rain this afternoon, will you keep drying, split the batch or prepare a cover?"></p><p class="wb-caption" data-zh="教学情景" data-en="Teaching scenario"></p><p id="game-handoff" class="game-handoff" hidden data-zh="刚才比较的是机场温度。现在回到 Thoko 家的庭院，练习如何面对可能的降雨；这里的天气不来自刚才的温度数据。" data-en="You just compared airport temperatures. Now step into Thoko’s courtyard to practice preparing for possible rain. This exercise does not use those temperature records."></p><ol class="game-progress" aria-label="Exercise progress"><li data-stage="prepare" data-zh="做准备" data-en="Prepare"></li><li data-stage="weather" data-zh="看天气" data-en="See the weather"></li><li data-stage="review" data-zh="比较选择" data-en="Compare choices"></li></ol><div class="diorama"><div id="scene" role="img" aria-label="Interactive 3D courtyard with house, maize rack, cover, storage and character"><img class="game-poster" src="../../thoko-family.png" alt="Thoko 一家在庭院晾晒玉米的情景插画" data-alt-zh="Thoko 一家在庭院晾晒玉米的情景插画" data-alt-en="Illustration of Thoko’s household drying maize in the courtyard"></div><div class="game-overlay"><p id="game-status" tabindex="-1" role="status" aria-live="polite"></p><button id="start-game" class="wb-primary" data-zh="进入庭院 →" data-en="Enter the courtyard →"></button><div id="first-choice" hidden><p data-zh="现在先做什么？" data-en="What will you do first?"></p><div class="game-buttons"><button data-first="all" data-zh="继续晾晒" data-en="Keep drying"></button><button data-first="store" data-zh="收起来" data-en="Bring it in"></button><button data-first="information" data-zh="查看天气信息" data-en="Check weather information"></button></div></div><section id="weather-panel" hidden aria-label="Weatherbridge teaching information"><h2>Weatherbridge</h2><dl><dt data-zh="最可能出现什么？" data-en="What is most likely?"></dt><dd data-zh="下午更可能有阵雨。" data-en="Afternoon showers are more likely."></dd><dt data-zh="判断有多确定？" data-en="How uncertain?"></dt><dd data-zh="当前信息更偏向有雨，但无雨仍然可能。" data-en="The available signal leans toward rain, but dry weather remains possible."></dd><dt data-zh="现在可以先准备什么？" data-en="What can you prepare now?"></dt><dd data-zh="先备好遮盖物，或收起一部分玉米，让剩下的继续晾晒。" data-en="Have a cover ready, or bring in part of the maize while the rest keeps drying."></dd></dl></section><div id="second-choice" hidden><p data-zh="看过信息后，你会怎样安排？" data-en="With that information, how will you arrange it?"></p><div class="game-buttons"><button data-choice="all" data-zh="全部晾晒" data-en="Dry all"></button><button data-choice="batch" data-zh="分批晾晒" data-en="Split the batch"></button><button data-choice="cover" data-zh="准备遮盖" data-en="Prepare a cover"></button><button data-choice="store" data-zh="提前收储" data-en="Store early"></button></div></div><div id="weather-choice" hidden><button id="reveal-weather" class="wb-primary" data-zh="准备好了，看看天气 →" data-en="Ready. See the weather →"></button><button id="change-choice" class="game-change" data-zh="还没揭晓，重新选" data-en="Change my preparation"></button></div><div id="result-choice" hidden><p id="choice-consequence"></p><a id="debrief-link" class="wb-primary" data-preserve-language data-zh="比较这场天气下的不同选择 →" data-en="Compare choices under this weather →"></a></div></div></div><div class="game-settings"><button id="pause-motion" data-zh="暂停动画" data-en="Pause animation"></button><button id="restart-game" data-zh="开始新的一天" data-en="Start a new day"></button><button id="text-mode" data-zh="使用图片和文字" data-en="Use images and text"></button></div><p id="fallback-note" class="wb-caption" hidden data-zh="当前使用文字替代模式；选择和复盘仍可完成。支持 WebGL 的设备可重新尝试 3D。" data-en="Text alternative is active. Choices and debrief still work. Retry 3D on a WebGL-capable device."></p><details class="wb-disclosure"><summary data-zh="规则、信息来源与限制 +" data-en="Rules, information sources & limits +"></summary><p data-zh="这是一个简化的教学情景。天气结果与玩家选择独立，用来比较不同准备方式在同一结果下的取舍。" data-en="This is a simplified teaching scenario. The weather outcome is independent of your choice, so you can compare different preparations under the same outcome."></p><p data-zh="它不使用马拉维实时天气或真实预测市场数据，也不模拟食品安全、产量或经济损失。现实决策应优先参考当地正式天气信息。" data-en="It uses neither live Malawi weather nor real prediction-market data, and does not model food safety, yields or financial losses. For real decisions, use official local weather information first."></p></details></main><script src="../../site-header.js"></script><script type="module" src="../../src/game.js"></script></body></html>
